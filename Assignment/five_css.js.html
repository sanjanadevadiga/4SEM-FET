<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exp 11: Z-Index Stacking Lab</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            position: relative; /* Context for children's absolute positioning */
            width: 300px;
            height: 300px;
        }

        .card {
            width: 150px;
            height: 200px;
            position: absolute; /* REQUIRED: z-index only works on positioned elements */
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            border: 2px solid white;
        }

        .card:hover {
            transform: scale(1.05);
        }

        /* Initial positions and colors */
        #redCard   { background: #ff4d4d; top: 0; left: 0; z-index: 1; }
        #blueCard  { background: #4d94ff; top: 40px; left: 40px; z-index: 2; }
        #greenCard { background: #4caf50; top: 80px; left: 80px; z-index: 3; }
    </style>
</head>
<body>

    <div class="container">
        <div id="redCard" class="card" onclick="stackMe(this)">Layer 1</div>
        <div id="blueCard" class="card" onclick="stackMe(this)">Layer 2</div>
        <div id="greenCard" class="card" onclick="stackMe(this)">Layer 3</div>
    </div>

    <script>
        // Track the highest Z-index value globally
        let topLayer = 10;

        function stackMe(element) {
            // 1. Increment the counter
            topLayer++;

            // 2. Manipulate the CSS z-index property via JavaScript
            element.style.zIndex = topLayer;

            // Optional: Logging to see the values change in real-time
            console.log("Element " + element.id + " is now at Z-Index: " + topLayer);
        }
    </script>

</body>
</html>
