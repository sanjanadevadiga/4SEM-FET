<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Iterative Control Structures Lab</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px; 
            background-color: #f0f2f5; 
        }
        .main-container { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
        }
        .item-card { 
            background: #f8f9fa; 
            margin: 10px 0; 
            padding: 15px; 
            border-left: 5px solid #28a745; 
            border-radius: 5px;
            font-family: monospace;
        }
        h2 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .console-note { font-size: 0.9rem; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="main-container">
        <h2>Iterative Logic Engine</h2>
        
        <!-- Target for Loop Output -->
        <div id="loop-display"></div>

        <p class="console-note">
            *Open the Browser Console (F12) to see the Do-While verification log.
        </p>
    </div>

    <script>
        /**
         * EXPERIMENT 12: LOOPS
         */
        const display = document.getElementById('loop-display');

        // 1. WHILE LOOP: Dynamic Content Generation
        display.innerHTML += "<h3>While Loop Execution:</h3>";
        
        let i = 1;
        while (i <= 5) {
            display.innerHTML += `<div class="item-card">Iteration Count: ${i} | Status: OK</div>`;
            i++; 
        }

        // 2. DO...WHILE LOOP: Process Verification
        console.log("--- Initializing Background Process Verification ---");
        
        let counter = 1;
        do {
            console.log("Process Cycle " + counter + ": Verified");
            counter++;
        } while (counter <= 3);

        // Confirmation of script execution
        alert("Experiment 12: All Loops Executed Successfully!");
    </script>

</body>
</html>
