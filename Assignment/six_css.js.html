<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Z-Index System</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to right,#1e3c72,#2a5298);
color:white;
}

header,footer{text-align:center;padding:20px;}

h1{color:#ffd700;}

.main{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
padding:20px;
}

.container{
position:relative;
width:700px;
height:500px;
background:rgba(255,255,255,0.1);
border-radius:15px;
overflow:hidden;
}

.card{
position:absolute;
width:170px;
height:220px;
border-radius:12px;
border:2px solid white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 6px 15px rgba(0,0,0,0.4);
}

.card:hover{
transform:scale(1.05);
}

.card small{
font-size:14px;
margin-top:10px;
}

.panel{
width:280px;
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:15px;
}

button{
width:100%;
padding:10px;
margin:8px 0;
border:none;
border-radius:8px;
background:#ffd700;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:white;
}

#status{
margin-top:15px;
padding:10px;
background:rgba(255,255,255,0.15);
border-radius:8px;
min-height:60px;
}

a{
text-decoration:none;
background:white;
color:#1e3c72;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>Dynamic Z-Index Stacking</h1>
<p>Interactive cards using CSS and JavaScript</p>
</header>

<div class="main">

<div id="app" class="container"></div>

<div class="panel">
<h2>Controls</h2>

<button id="resetBtn">Reset</button>
<button id="shuffleBtn">Shuffle</button>
<button id="colorBtn">Random Colors</button>
<button id="rotateBtn">Rotate</button>
<button id="addBtn">Add Card</button>
<button id="removeBtn">Remove Card</button>

<div id="status">System Ready...</div>

</div>
</div>

<footer>
<a href="https://sanjanadevadiga.github.io/4SEM-FET/">">My Resume</a>
</footer>

<script>
const app=document.getElementById("app");
const statusBox=document.getElementById("status");

const colors=[
"#ff4b5c","#3498db","#2ecc71",
"#9b59b6","#f39c12","#1abc9c"
];

const tech=[
"HTML","CSS","JavaScript",
"React","Python","Java"
];

let cards=[];
let highestZ=100;

function createCard(i){

let card=document.createElement("div");

card.className="card";
card.style.background=colors[i%colors.length];
card.style.left=(30+i*40)+"px";
card.style.top=(20+i*30)+"px";
card.style.zIndex=i;

card.innerHTML=
"Card "+(i+1)+
"<small>"+tech[i%tech.length]+"</small>";

card.onclick=function(){
highestZ++;
card.style.zIndex=highestZ;

statusBox.innerHTML=
card.innerText+" moved to front";
};

card.ondblclick=function(){
card.style.transform="rotate(10deg) scale(1.1)";

setTimeout(()=>{
card.style.transform="scale(1)";
},400);
};

app.appendChild(card);
cards.push(card);
}

for(let i=0;i<6;i++) createCard(i);

document.getElementById("shuffleBtn").onclick=function(){

cards.forEach(card=>{
card.style.left=Math.random()*500+"px";
card.style.top=Math.random()*250+"px";
});

statusBox.innerHTML="Cards Shuffled";
};

document.getElementById("colorBtn").onclick=function(){

cards.forEach(card=>{
card.style.background=
colors[Math.floor(Math.random()*colors.length)];
});

statusBox.innerHTML="Colors Changed";
};

document.getElementById("rotateBtn").onclick=function(){

cards.forEach(card=>{
card.style.transform=
"rotate("+(Math.random()*40-20)+"deg)";
});

statusBox.innerHTML="Cards Rotated";
};

document.getElementById("resetBtn").onclick=function(){

cards.forEach((card,i)=>{
card.style.left=(30+i*40)+"px";
card.style.top=(20+i*30)+"px";
card.style.transform="rotate(0deg)";
card.style.zIndex=i;
});

statusBox.innerHTML="System Reset";
};

document.getElementById("addBtn").onclick=function(){

createCard(cards.length);
statusBox.innerHTML="New Card Added";
};

document.getElementById("removeBtn").onclick=function(){

if(cards.length==0) return;

cards.pop().remove();

statusBox.innerHTML="Last Card Removed";
};

document.addEventListener("keydown",e=>{

if(e.key=="r") shuffleBtn.click();
if(e.key=="c") colorBtn.click();
if(e.key=="z") resetBtn.click();

});
</script>

</body>
</html>
