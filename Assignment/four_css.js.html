<!DOCTYPE html>
<html>
<body>
    <fieldset>
        <legend>Exp 10: Menus & Listeners</legend>
        <select id="drop">
            <option>Select Option</option>
            <option value="X">Option X</option>
            <option value="Y">Option Y</option>
        </select>
        <br><br>
        <select id="list" multiple>
            <option>Item 1</option>
            <option>Item 2</option>
        </select>
    </fieldset>

    <script>
        const d = document.getElementById('drop');
        const l = document.getElementById('list');

        // Event Listener (Pull-down)
        d.addEventListener('change', () => alert("Selected: " + d.value));

        // Event Handler (List Box)
        l.onchange = () => {
            let picks = Array.from(l.selectedOptions).map(o => o.value);
            console.log("List Picks: ", picks);
        };
    </script>
</body>
</html>
