<!DOCTYPE html>
<html>
<head>
    <title>Technical Skills List</title>

    <style>

        body{
            background:linear-gradient(to right,#ff512f,#dd2476);
            font-family:Arial;
            padding:20px;
            color:white;
            text-align:center;
        }

        input,select,button{
            margin:5px;
            padding:8px;
            border:none;
            border-radius:5px;
        }

        button{
            background:#fff176;
            color:black;
            font-weight:bold;
        }

        ol{
            width:60%;
            margin:auto;
            text-align:left;
        }

        ul{
            background:rgba(255,255,255,0.15);
            padding:10px;
            border-radius:8px;
        }

        a{
            text-decoration:none;
            background:white;
            color:#dd2476;
            padding:10px 15px;
            border-radius:8px;
            font-weight:bold;
        }

    </style>
</head>

<body>

<h1>Technical Skills</h1>

<input id="skillInput" placeholder="Enter Skill">

<select id="categorySelect">
    <option value="prog">Programming Languages</option>
    <option value="tools">Tools and Technologies</option>
    <option value="core">Core Computer Science</option>
</select>

<button onclick="addSkill()">Add</button>

<button onclick="removeSkill()">Remove</button>

<ol>

<li>
Programming Languages

<li>C</li>
<li>Python</li>
<li>Java</li>
</ul>
</li>

<li>
Tools and Technologies
<ul id="tools">
<li>VS Code</li>
<li>Git</li>
<li>Linux</li>
</ul>
</li>

<li>
Core Computer Science
<ul id="core">
<li>Programming</li>
<li>Data Structures</li>
<li>Algorithms</li>
</ul>
</li>

</ol>

</html>
